global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  - job_name: quickcart
    static_configs:
      - targets: ["host.docker.internal:4000", "host.docker.internal:4001"]

  - job_name: platform
    static_configs:
      - targets: ["host.docker.internal:8080", "host.docker.internal:8081"]
